name: notesapp

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME:-notesapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-notesapp_development}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-notesapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: development
    command: sh -c "bundle check || bundle install && bundle exec rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME:-notesapp}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
      - tmp_data:/rails/tmp
      - storage_data:/rails/storage
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db_data:
  bundle_data:
  tmp_data:
  storage_data: