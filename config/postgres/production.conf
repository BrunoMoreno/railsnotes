# Minimal recommended settings for a single-node production PostgreSQL (Kamal accessory).
# Tune based on available memory and workload.

listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 100MB
max_wal_size = 1GB
log_min_duration_statement = 1000
random_page_cost = 1.1