# PostgreSQL. Versions 15, 16 and 17 are supported.
#   gem "pg"
#
# Connection settings are taken from environment variables so the same
# config works locally, in Docker Compose, in CI and on production (Kamal).
#
#   DB_HOST      - database host            (default: 127.0.0.1)
#   DB_PORT      - database port            (default: 5432)
#   DB_USERNAME  - database user            (default: notesapp)
#   DB_PASSWORD  - database password        (default: password)
#   DB_DATABASE  - production database name (default: notesapp_production)
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", "5432") %>
  username: <%= ENV.fetch("DB_USERNAME", "notesapp") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>

development:
  <<: *default
  database: notesapp_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: notesapp_test

# Production uses one PostgreSQL server; cache, queue and cable
# connections share the primary credentials but use separate databases.
production:
  primary: &production_production
    <<: *default
    database: <%= ENV.fetch("DB_DATABASE") { "notesapp_production" } %>
  cache:
    <<: *production_production
    database: notesapp_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_production
    database: notesapp_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_production
    database: notesapp_production_cable
    migrations_paths: db/cable_migrate